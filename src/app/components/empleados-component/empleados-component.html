<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Listado de Empleados</h2>
  </div>

  <div class="table-responsive shadow-sm rounded">
    <a class="nav-link" [routerLink]="['/subordinados']" routerLinkActive="active">
      <button>Subordinados</button>
    </a>
    <table class="table table-striped table-hover align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Apellido</th>
          <th scope="col">Oficio</th>
          <th scope="col">Salario</th>
          <th scope="col">Director</th>
        </tr>
      </thead>
      <tbody>
        @for (empleado of empleados; track empleado.idEmpleado) {
          <tr>
            <th scope="row">{{ empleado.idEmpleado }}</th>
            <td>{{ empleado.apellido }}</td>
            <td>{{ empleado.oficio }}</td>
            <td>{{ empleado.salario }} €</td>
            <td>{{ empleado.director }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
